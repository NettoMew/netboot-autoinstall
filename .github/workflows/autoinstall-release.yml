name: autoinstall-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build and Publish Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7

    - name: Build bootloaders
      run: |
        docker build -t localbuild .
        docker run --rm -v "$PWD:/buildout" localbuild

    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" buildout/ipxe/* \
          --title "$GITHUB_REF_NAME" --notes-from-tag --verify-tag
